name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      APP_URL: https://next-session.link
      LONIR_URL: https://little-spaniel-709.convex.site
    steps:
      - uses: actions/checkout@v7
      - name: Skip unless this commit is still the head of main
        id: head
        run: |
          main_ref="$(git ls-remote --exit-code origin refs/heads/main)"
          main_head="${main_ref%%[[:space:]]*}"
          if [ "$main_head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved on to $main_head; skipping the deploy of $GITHUB_SHA"
          fi
      - if: steps.head.outputs.current == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - if: steps.head.outputs.current == 'true'
        run: bun install --frozen-lockfile
      - name: Deploy Convex and build the SPA against it
        if: steps.head.outputs.current == 'true'
        run: |
          : "${LEGAL_CONTROLLER_ADDRESS:?is not set as a repo variable}" "${LEGAL_CONTACT_EMAIL:?is not set as a repo variable}"
          bunx convex deploy --cmd 'bun run build' --cmd-url-env-var-name VITE_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          LEGAL_CONTROLLER_ADDRESS: ${{ vars.LEGAL_CONTROLLER_ADDRESS }}
          LEGAL_CONTACT_EMAIL: ${{ vars.LEGAL_CONTACT_EMAIL }}
          VITE_POSTHOG_TOKEN: ${{ vars.VITE_POSTHOG_TOKEN }}
          VITE_RELEASE: ${{ github.sha }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      - name: Refuse to ship source maps
        if: steps.head.outputs.current == 'true'
        run: |
          maps="$(find dist -name '*.map')"
          if [ -n "$maps" ]; then
            echo "::error::dist/ holds source maps: $maps"
            exit 1
          fi
      - name: Deploy the Worker
        if: steps.head.outputs.current == 'true'
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke the deployed app
        if: steps.head.outputs.current == 'true'
        run: |
          expect_response() {
            local path="$1" expected="$2" actual=""
            for attempt in 1 2 3 4 5 6; do
              actual="$(curl --silent --max-time 10 --output /dev/null --write-out '%{http_code} %{redirect_url}' "$APP_URL$path" || true)"
              [ "$actual" = "$expected" ] && return 0
              sleep 5
            done
            echo "::error::$path answered '$actual', expected '$expected'"
            return 1
          }
          expect_response / "200 "
          expect_response "/g/smoke-deep-link?month=2026-01" "200 "
          expect_response /s/AAAAAAAAAA "200 "
          expect_response /s/AAAAAAAA "302 $LONIR_URL/s/AAAAAAAA"
          expect_response "/groups/smoke?month=2026-01" "302 $LONIR_URL/groups/smoke?month=2026-01"
          expect_response /ingest/ "204 "
